name: Test and deploy

# No `push` trigger: deploying is a deliberate act, not a side effect of every
# commit to main. Pull requests still run the checks; the deploy runs when you
# ask for it via Actions > Test and deploy > Run workflow.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # There is no build step, so this is the only thing standing between a typo
  # and a live URL: the shipped files exist, every local path in index.html /
  # styles.css resolves, and script.js actually parses. The deploy depends on it.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Site check (files present, local references resolve)
        run: python3 scripts/check_site.py

      - name: JavaScript parses
        run: node --check script.js

      - name: Staging produces a complete site
        run: |
          bash scripts/stage_site.sh _site
          test -f _site/index.html
          test -f _site/styles.css
          test -f _site/script.js
          test -f _site/assets/logo.png

  pages:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Job-level permissions replace the workflow-level block outright, so
    # contents: read has to be repeated here or checkout is relying on this
    # repo being public.
    permissions:
      contents: read
      deployments: read
      pages: write
      id-token: write
    # Repo-wide and on the deploy job only. A Pages deployment belongs to the
    # repository, not to a branch, so two runs deploying at once means one gets
    # superseded ("Error: Deployment cancelled"). Serialising here — rather than
    # at workflow level — keeps deploys one-at-a-time without making PR checks
    # queue behind a deploy.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # If the repo's Pages source is "Deploy from a branch" (build_type
      # "legacy"), GitHub records the deployment but the legacy pipeline never
      # picks it up, so deploy-pages sits in `deployment_queued` until it times
      # out. Nothing here can repair that: configure-pages only sets build_type
      # on a site it creates, and GITHUB_TOKEN is refused on the update endpoint
      # (tried, got 'legacy' back). It is a one-time manual setting, so just
      # fail in seconds with the fix rather than hanging for ten minutes.
      - name: Pages source must be GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          build_type=$(gh api "repos/$REPO/pages" --jq '.build_type' 2>/dev/null || echo 'not-enabled')
          echo "Pages build_type: $build_type"
          if [ "$build_type" != "workflow" ]; then
            echo "::error title=Pages source is not GitHub Actions::build_type is '$build_type'. \
            Set it by hand once: Settings > Pages > Build and deployment > Source > 'GitHub Actions', \
            then re-run. Deployments queue forever otherwise."
            exit 1
          fi

      # Pages processes one deployment per repository at a time. A deployment
      # created while the source was still "legacy" is never processed and never
      # completes, so it holds that slot and every later deployment sits at
      # `deployment_queued` behind it — forever, not slowly.
      #
      # Cancel any leftover queued/in_progress deployment before creating ours.
      # Best-effort throughout: a failure here must not block a deploy that would
      # otherwise work, so every call falls through.
      - name: Clear stuck Pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          shas=$(gh api "repos/$REPO/deployments?environment=github-pages&per_page=30" \
                   --jq '.[].sha' 2>/dev/null || true)

          if [ -z "$shas" ]; then
            echo "No github-pages deployments on record."
            exit 0
          fi

          stuck=0
          for sha in $shas; do
            status=$(gh api "repos/$REPO/pages/deployments/$sha" --jq '.status' 2>/dev/null || echo 'unknown')
            case "$status" in
              queued|in_progress)
                stuck=$((stuck + 1))
                echo "cancelling $sha (status: $status)"
                if gh api -X POST "repos/$REPO/pages/deployments/$sha/cancel" >/dev/null 2>&1; then
                  echo "  cancelled"
                else
                  echo "  cancel refused — may need doing by hand"
                fi
                ;;
              *)
                echo "$sha: $status"
                ;;
            esac
          done
          echo "Cleared $stuck stuck deployment(s)."

      # No `enablement: true`: it calls POST /repos/{o}/{r}/pages, which needs
      # rights GITHUB_TOKEN does not have. The check above covers that case with
      # a clearer message anyway.
      - uses: actions/configure-pages@v6

      - name: Stage the site
        run: bash scripts/stage_site.sh _site

      # upload-pages-artifact and deploy-pages are released in lockstep and the
      # artifact format is shared, so keep these two on the same major.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5
