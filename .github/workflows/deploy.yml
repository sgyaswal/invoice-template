name: Test and deploy

# No `push` trigger: deploying is a deliberate act, not a side effect of every
# commit to main. Pull requests still run the checks; the deploy runs when you
# ask for it via Actions > Test and deploy > Run workflow.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # There is no build step, so this is the only thing standing between a typo
  # and a live URL: the shipped files exist, every local path in index.html /
  # styles.css resolves, and script.js actually parses. Both deploy jobs depend
  # on it.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Site check (files present, local references resolve)
        run: python3 scripts/check_site.py

      - name: JavaScript parses
        run: node --check script.js

      - name: Staging produces a complete site
        run: |
          bash scripts/stage_site.sh _site
          test -f _site/index.html
          test -f _site/styles.css
          test -f _site/script.js
          test -f _site/assets/logo.png

  pages:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # If the repo's Pages source is still "Deploy from a branch", GitHub
      # records the deployment but the legacy pipeline never picks it up, so
      # deploy-pages sits in `deployment_queued` until it times out. Nothing in
      # the workflow can repair that: configure-pages only sets build_type on a
      # site it creates, and this site already exists. So check up front and
      # fail in seconds with the fix, rather than hanging with no explanation.
      - name: Pages source must be GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/${{ github.repository }}/pages" --jq '.build_type' 2>/dev/null || echo 'not-enabled')
          echo "Pages build_type: $build_type"
          if [ "$build_type" != "workflow" ]; then
            echo "::error title=Pages source is not GitHub Actions::build_type is '$build_type'. \
            Set Settings > Pages > Build and deployment > Source to 'GitHub Actions', then re-run. \
            Deployments queue forever otherwise."
            exit 1
          fi

      # No `enablement: true` here: it calls POST /repos/{o}/{r}/pages, which
      # needs admin rights that GITHUB_TOKEN does not have, so it fails on a repo
      # where Pages was never turned on. Enable it once by hand instead —
      # Settings > Pages > Source: GitHub Actions.
      - uses: actions/configure-pages@v5

      - name: Stage the site
        run: bash scripts/stage_site.sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
